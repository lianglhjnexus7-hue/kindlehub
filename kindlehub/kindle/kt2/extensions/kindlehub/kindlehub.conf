# KindleHub 直写配置 —— 修改后重启服务生效（initctl restart kindlehub）
#
# Mac 的局域网地址（必填）。在 Mac 上运行: ipconfig getifaddr en0
# 换 Wi-Fi 后 IP 可能变，需要同步改这里。
DASHBOARD_URL="http://192.168.1.100:8787/screen.png"

# 刷新间隔（秒）。e-ink 建议不低于 30 秒。
REFRESH_SECONDS=60

# KT2 = Kindle 第 7 代，600x800。
SCREEN_WIDTH=600
SCREEN_HEIGHT=800

# 系统状态栏占用高度（像素）。图片从这里下方开始画，
# 这样顶部的电量/时间/WiFi 不会被覆盖。
TOP_INSET=40
