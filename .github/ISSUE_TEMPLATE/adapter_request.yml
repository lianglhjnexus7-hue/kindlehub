name: 新 Agent 适配器
description: 提交一个新的 Agent 适配器
labels: ["enhancement"]
body:
  - type: input
    id: agent
    attributes:
      label: Agent 名称
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 状态数据来源
      description: 用什么判断"正在执行"？会话文件、数据库还是 HTTP 接口？
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: 确认遵守以下规则
      options:
        - label: 只读，不修改任何数据库或配置
        - label: 不读对话正文与账号身份
        - label: 找不到可靠证据时返回 unknown，不伪造
        - label: 状态带 confidence 与 basis